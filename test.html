<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockConnect — Diagnostic</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #f4f6f5; color: #1c2b26; padding: 20px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; color: #0f5132; }
  .etape { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
  .ok { color: #166534; font-weight: 700; }
  .ko { color: #991b1b; font-weight: 700; }
  .info { color: #64748b; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 6px 0; }
  button { width: 100%; padding: 12px; background: #198754; color: #fff; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .conclu { font-size: 15px; font-weight: 800; padding: 14px; border-radius: 10px; margin-top: 12px; }
</style>
</head>
<body>
<h1>StockConnect — Diagnostic technique</h1>
<p style="font-size:14px;color:#64748b">Cette page n'est jamais mise en cache. Remplis entité + resto puis clique le bouton.</p>

<div class="etape">
  <label>Code entité</label>
  <input id="entite" placeholder="ex : mama-hamamet" value="mama-hamamet">
  <label>Numéro resto (1-4)</label>
  <input id="resto" type="number" min="1" value="1">
  <button onclick="lancer()">Lancer le diagnostic complet</button>
</div>

<div id="resultats"></div>

<script>
const $ = id => document.getElementById(id);
const resultats = $("resultats");

function ligne(nom, statut, detail) {
  const emoji = statut === "ok" ? "✅" : statut === "ko" ? "❌" : "⏳";
  return '<div class="etape"><b>' + emoji + " " + nom + "</b><br><span class='" +
    (statut === "ok" ? "ok" : statut === "ko" ? "ko" : "info") + "'>" + (detail || "") + "</span></div>";
}

function maj(html) { resultats.innerHTML = html; }

async function lancer() {
  const entite = $("entite").value.trim().toLowerCase();
  const resto = Number($("resto").value) || 1;
  if (!entite) { maj(ligne("Entité", "ko", "Saisis un code entité")); return; }
  const html = [];
  html.push(ligne("Version de l'app ", "ok", "Cette page = test direct (hors app)."));
  html.push(ligne("Navigateur", "ok", navigator.userAgent));
  maj(html.join(""));

  // Étape 1 : WebSocket WSS vers le broker
  let wsResult = "";
  const wsEtape = ligne("Connexion WSS au broker", "attente", "wss://broker.emqx.io:8084/mqtt …");
  html.push(wsEtape);
  maj(html.join(""));
  await new Promise((resolve) => setTimeout(resolve, 50));

  try {
    const connOk = await testBroker(entite, resto);
    html.push(connOk.html);
    maj(html.join(""));
  } catch (e) {
    html.push(ligne("Connexion au broker", "ko", "Échec : " + e.message + "\n→ Vérifie ta connexion internet / le port WSS 8084."));
    maj(html.join(""));
    return;
  }
}

// Abonnement + demande de synchronisation complète
function testBroker(entite, resto) {
  return new Promise((resolve, reject) => {
    if (typeof mqtt === "undefined") {
      reject(new Error("mqtt.js non chargé — recharge la page"));
      return;
    }
    let articles = null;
    let etapes = [];

    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "sc-diag-" + Math.random().toString(16).slice(2, 8),
      connectTimeout: 12000,
      reconnectPeriod: 0,
    });

    const fini = (ok, msg) => {
      try { client.end(true); } catch (e) {}
      const total = etapes.join("") +
        ligne(ok ? "TEST COMPLET RÉUSSI" : "TEST ÉCHOUÉ", ok ? "ok" : "ko",
          articles !== null ? articles : msg);
      resolve({ html: total });
    };

    client.on("connect", () => {
      etapes.push(ligne("Étape 1 — Connecté au broker ✅", "ok", ""));
      client.subscribe("stockconnect/" + entite + "/resto/" + resto + "/sync/state", { qos: 1 }, (err) => {
        if (err) { etapes.push(ligne("Étape 2 — Abonnement", "ko", err.message)); fini(false, err.message); return; }
        etapes.push(ligne("Étape 2 — Abonnement sync/state ✅", "ok", ""));
        client.publish("stockconnect/" + entite + "/resto/" + resto + "/sync/request",
          JSON.stringify({ dev: "diagnostic" }), { qos: 1 });
        etapes.push(ligne("Étape 3 — Demande de synchronisation envoyée", "ok", ""));
      });
    });

    client.on("message", (topic, payload) => {
      try {
        const reponse = JSON.parse(payload.toString());
        articles = "Articles reçus du central : " +
          (reponse.articles ? reponse.articles.map(a => "\n  " + a.ref + " — " + a.design + " (stock " + a.qte + ")").join("") : "AUCUN") +
          "\nResto : " + reponse.resto_id;
        fini(true, articles);
      } catch (e) {
        fini(false, "Réponse illisible : " + e.message);
      }
    });

    client.on("error", (e) => fini(false, "Erreur broker : " + e.message));
    client.on("close", () => { if (articles === null) fini(false, "Connexion fermée sans réponse"); });
    setTimeout(() => { if (articles === null) fini(false, "Délai dépassé (12 s) — aucune réponse du broker"); }, 15000);
  });
}
</script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</body>
</html>
